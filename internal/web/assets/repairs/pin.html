<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Repairs log — Sign in</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='black'/><text x='16' y='23' font-size='20' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>R</text></svg>">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand"><span class="brand-mark">R</span> Repairs log</div>
    <p class="sub">Enter the shared 6-digit code to continue.</p>

    <form id="form">
      <div class="field">
        <label>6-digit code</label>
        <div class="pin-boxes" id="pin-boxes">
          <div class="pin-box"></div>
          <div class="pin-box"></div>
          <div class="pin-box"></div>
          <div class="pin-box"></div>
          <div class="pin-box"></div>
          <div class="pin-box"></div>
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                 autocomplete="one-time-code" class="pin-hidden-input" aria-label="6-digit code">
        </div>
      </div>
      <button class="btn solid" type="submit" id="submit">Continue</button>
      <div class="login-err" id="err" role="alert"></div>
    </form>
  </div>
</div>
<script src="/static/repairs/pinbox.js"></script>
<script src="/static/repairs/pin.js"></script>
</body>
</html>
