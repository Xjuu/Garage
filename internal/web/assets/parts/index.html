<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Parts counter</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/parts/parts.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='black'/><text x='16' y='23' font-size='20' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>P</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="brand-mark">P</span> Parts counter</div>
    <span class="credit">Made by Filip Klonowski</span>
    <div class="spacer"></div>
    <button class="btn" id="btn-signout">Sign out</button>
  </div>
</header>

<main class="pc-main">

  <nav class="pc-trail" aria-hidden="true">
    <span class="pc-trail-step" data-step="part">1 · Part</span>
    <span class="pc-trail-sep">→</span>
    <span class="pc-trail-step" data-step="vehicle">2 · Vehicle</span>
    <span class="pc-trail-sep">→</span>
    <span class="pc-trail-step" data-step="qty">3 · Quantity</span>
  </nav>

  <!-- Step 1: which part -->
  <section class="pc-step" id="step-part">
    <div class="section-title">Which part</div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="part-search" autocomplete="off"
             placeholder="Part number or description… or tap in to browse all">
    </div>
    <div class="pc-results-label" id="part-results-label" hidden></div>
    <div class="pc-results" id="part-results" hidden></div>
  </section>

  <!-- The chosen part, once picked -->
  <section class="pc-picked" id="picked-part" hidden>
    <img id="picked-part-photo" class="pc-photo" alt="" hidden>
    <div class="pc-picked-body">
      <div class="pc-picked-num" id="picked-part-num"></div>
      <div class="pc-picked-desc" id="picked-part-desc"></div>
      <div class="pc-picked-stock" id="picked-part-stock"></div>
    </div>
    <button class="btn sm" id="picked-part-clear">Change</button>
  </section>

  <!-- Step 2: which vehicle -->
  <section class="pc-step" id="step-vehicle" hidden>
    <div class="section-title">For which vehicle</div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="vehicle-search" autocomplete="off"
             placeholder="Registration… or tap in to browse all">
    </div>
    <div class="pc-results-label" id="vehicle-results-label" hidden></div>
    <div class="pc-results" id="vehicle-results" hidden></div>
  </section>

  <div class="pc-picked" id="picked-vehicle" hidden>
    <div class="pc-picked-body">
      <span class="reg pc-picked-reg" id="picked-vehicle-reg"></span>
    </div>
    <button class="btn sm" id="picked-vehicle-clear">Change</button>
  </div>

  <!-- Step 3: how many, and log it -->
  <section class="pc-step" id="step-qty" hidden>
    <div class="section-title">How many</div>
    <div class="pc-qty-row">
      <button class="btn qty-step" id="qty-minus" type="button" aria-label="One fewer">−</button>
      <input type="number" id="qty" value="1" min="0.01" step="any" inputmode="decimal">
      <button class="btn qty-step" id="qty-plus" type="button" aria-label="One more">+</button>
    </div>
    <button class="btn solid pc-log" id="btn-log">Log it</button>
    <div class="login-err" id="log-err" role="alert"></div>
  </section>

</main>

<div class="toasts" id="toasts"></div>

<script src="/static/parts/app.js"></script>
</body>
</html>
